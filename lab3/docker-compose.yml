version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: vuln-dw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vuln_dw
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
